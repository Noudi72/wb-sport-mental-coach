<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Mental-Check-ins</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body {
      background-color: #fdf7f0;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Navigation */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background-color: #fdf7f0;
      border-bottom: 2px solid #002b5c;
    }

    nav .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav img {
      height: 50px;
    }

    nav a {
      background-color: #002b5c;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    nav a:hover {
      background-color: #004080;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #002b5c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    table th, table td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    table th {
      background-color: #002b5c;
      color: white;
    }

    #msg {
      text-align: center;
      margin-top: 20px;
    }

    input, button {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin: 5px 0;
    }

    button {
      background-color: #002b5c;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #004080;
    }
  </style>
</head>
<body>
  <!-- Admin-Navigation -->
  <nav>
    <div class="nav-left">
      <img src="assets/logo/logo.png" alt="WB Logo" />
      <strong style="color:#002b5c;">Admin-Bereich</strong>
    </div>
    <div class="nav-right">
      <a href="admin.html">Übersicht</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <main>
    <h1>Mental-Check-ins verwalten</h1>
    <p id="msg">Lade Daten …</p>

    <input type="text" id="searchInput" placeholder="🔍 Suchen nach Name oder Eintrag …" style="width:100%;" />
    <button id="exportBtn" style="display:none;">📄 Export als CSV</button>

    <table id="tbl" style="display:none;">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Name</th>
          <th>Check-in</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>
    © 2025 Waltraud Blaurock Sport Mental Coach – Admin
  </footer>

  <script type="module">
    import { supabase } from './js/supa.js';

    const ADMIN_MAIL = 'w.blaurock80@outlook.com';
    const msg = document.getElementById('msg');
    const tbl = document.getElementById('tbl');
    const tbody = tbl.querySelector('tbody');
    const searchInput = document.getElementById('searchInput');
    const exportBtn = document.getElementById('exportBtn');

    // Admin-Check
    const { data: { user }, error } = await supabase.auth.getUser();
    if (error || !user || user.email !== ADMIN_MAIL) {
      alert('Kein Zugriff – bitte als Admin einloggen');
      location.href = 'login.html';
    }

    // Daten laden
    const { data, error: err } = await supabase
      .from('checkins')
      .select('*')
      .order('created_at', { ascending: false });

    if (err) {
      msg.textContent = 'Fehler: ' + err.message;
    } else if (!data.length) {
      msg.textContent = 'Keine Einträge vorhanden.';
    } else {
      msg.style.display = 'none';
      tbl.style.display = 'table';
      exportBtn.style.display = 'inline-block';

      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${new Date(row.created_at).toLocaleString()}</td>
          <td>${row.name || '-'}</td>
          <td>${row.entry || '-'}</td>
        `;
        tbody.appendChild(tr);
      });

      // Suche
      searchInput.addEventListener('input', () => {
        const val = searchInput.value.toLowerCase();
        Array.from(tbody.rows).forEach(row => {
          row.style.display = row.textContent.toLowerCase().includes(val) ? '' : 'none';
        });
      });

      // CSV Export
      exportBtn.addEventListener('click', () => {
        const csvRows = [
          ['Datum', 'Name', 'Eintrag'],
          ...data.map(r => [
            new Date(r.created_at).toLocaleString(),
            r.name || '',
            r.entry?.replace(/\n/g, ' ') || ''
          ])
        ];
        const csvContent = csvRows.map(e => e.map(v => `"${v}"`).join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'checkins.csv';
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      location.href = 'login.html';
    });
  </script>
</body>
</html>
