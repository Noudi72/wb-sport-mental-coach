<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin: Mental-Check-ins</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/supa.js" defer></script>
    <script type="module" src="/js/admin-auth.js" defer></script>
    <script type="module" src="/js/admin-frageboegen.js" defer></script>
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="assets/logo.png" alt="WB Mental Coach Logo">
                <span>Admin-Bereich</span>
            </div>
            <div class="nav-buttons">
                <a href="admin.html" class="btn">Übersicht</a>
                <button id="logout" class="btn logout">Logout</button>
            </div>
        </nav>
    </header>

    <!-- Hauptinhalt -->
<main class="container">
  <h1>Mental-Check-ins verwalten</h1>
  <div class="table-container">
    <table id="tbl" style="display: none;">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Name</th>
          <th>Stimmung</th>
          <th>Fokus</th>
          <th>Energie</th>
          <th>Kommentar</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="msg">Lade Daten...</p>
  </div>
  <div id="error-message" class="error-message"></div>
</main>

    <!-- Footer -->
    <footer>
        <p>© 2025 Waltraud Blaurock Sport Mental Coach – Admin</p>
    </footer>
</body>
</html>
