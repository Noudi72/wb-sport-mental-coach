<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Mentales Training, Motivation und Persönlichkeitsentwicklung mit WB Sport Mental Coach." />
  <meta name="theme-color" content="#0077cc" />
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="manifest" href="manifest.json" />
  <title>WB Sport Mental Coach</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Import Map für Supabase - löst das Problem mit relativen Imports -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/esm/index.js"
    }
  }
  </script>
  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('[SW] Registered:', reg))
          .catch((err) => console.error('[SW] Registration failed:', err));
      });
    }
  </script>
</head>
<body class="page page--home">
  <header class="navbar" role="banner">
    <a href="index.html" class="logo-link">
      <img src="assets/logo/logo.png" alt="Logo von WB Sport Mental Coach" class="logo" />
    </a>
    <nav aria-label="Hauptnavigation"></nav>
  </header>

  <main class="container" role="main">
    <div id="app-view">
      <!-- Views werden hier dynamisch geladen -->
    </div>
  </main>

  <footer role="contentinfo">
    © 2025 Waltraud Blaurock Sport Mental Coach
  </footer>

  <!-- App Initialisierung -->
  <script type="module">
    import { initApp } from './js/app.js';
    import { initDarkMode } from './js/dark-mode.js';
    import './js/error-handler.js';
    import { renderNav } from './js/nav.js';
    
    // Dark Mode initialisieren
    initDarkMode();
    
    // Navigation sofort rendern
    await renderNav();
    
    // App initialisieren (lädt Router und erste View)
    await initApp();
  </script>
</body>
</html>
